<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Icons &amp; Layers legend</title>
  <link rel="stylesheet" href="legend.css" />
</head>
<body>
  <h1>Icons &amp; Layers legend</h1>
  <section aria-labelledby="legend-title">
  <h2 id="legend-title">Icons</h2>
    <p class="hint">The following icons represent physical actions you perform on your keyboard to enter a character or access a layer. They are shown on the keyboard as these icons:</p>
    <div id="action-legend" class="card legend-list"></div>
  </section>
  <section aria-labelledby="layers-title">
    <div class="heading"><h2 id="layers-title">Layers</h2></div>
    <p id="layers-description" class="hint">Your keyboard has layers configured; here’s how to access them individually.</p>
    <p id="status" role="status">Loading layout…</p>
    <ul id="layers" class="card"></ul>
  </section>
  <script type="module" src="legend.js"></script>
</body>
</html>
