name: Tag merged release branch

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Existing tag to re-run the release build for (e.g. v0.1.5) — for
          recovering from a release build that failed after the tag was
          already created. Does not create or move any tag.
        required: true
        type: string

permissions:
  contents: write

jobs:
  tag:
    name: Tag merged release
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      startsWith(github.event.pull_request.head.ref, 'release/v'))
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag || steps.existing_tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: >-
            ${{ github.event_name == 'workflow_dispatch'
              && format('refs/tags/{0}', inputs.tag)
              || github.event.pull_request.merge_commit_sha }}
          fetch-depth: 1

      - name: Validate release branch and version
        if: github.event_name != 'workflow_dispatch'
        id: version
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$BRANCH" =~ ^release/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release branch must match release/vX.Y.Z (got $BRANCH)"
            exit 1
          fi
          TAG="${BRANCH#release/}"
          CONFIG_VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)
          if [[ "$TAG" != "v$CONFIG_VERSION" ]]; then
            echo "::error::$TAG does not match tauri.conf.json version $CONFIG_VERSION"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Use the provided existing tag
        # This path only re-enters the proven tag -> workflow_call chain for
        # a tag that already exists (e.g. its release build failed after
        # tagging) — it never creates or moves a tag itself. Direct pushes
        # to release.yml's own `push: tags` trigger have been observed to
        # get a GITHUB_TOKEN that GitHub's API rejects for release creation
        # ("Resource not accessible by integration") even with identical
        # declared permissions — going through this workflow_call path
        # (with `secrets: inherit`, see the release job below) is what's
        # actually proven to work for every past release.
        if: github.event_name == 'workflow_dispatch'
        id: existing_tag
        env:
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag must match vX.Y.Z (got $TAG)"
            exit 1
          fi
          if ! git rev-parse --verify "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG was not found (checkout would have failed already, but double-checking)."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create and push release tag
        if: github.event_name != 'workflow_dispatch'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            git fetch --no-tags origin "refs/tags/$TAG:refs/tags/$TAG"
            if [[ "$(git rev-parse "$TAG^{commit}")" != "$MERGE_SHA" ]]; then
              echo "::error::Tag $TAG already points to a different commit."
              exit 1
            fi
            echo "Tag $TAG already points to this merge; continuing the release."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$MERGE_SHA" -m "release: $TAG"
          git push origin "$TAG"

  release:
    name: Release tagged merge
    needs: tag
    permissions:
      contents: write
      id-token: write
      attestations: write
    # GITHUB_TOKEN tag pushes do not trigger other workflows. Call the same
    # release workflow directly instead. A called workflow does NOT
    # automatically see the caller's secrets (only the built-in
    # GITHUB_TOKEN is implicitly available) — `secrets: inherit` is
    # required for release.yml's TAURI_SIGNING_PRIVATE_KEY/_PASSWORD to
    # actually reach the tauri-action step; without it they're silently
    # empty strings there, which fails signing with a confusing
    # "Missing comment in secret key" error instead of a clear one about
    # a missing secret.
    uses: ./.github/workflows/release.yml
    secrets: inherit
    with:
      tag: ${{ needs.tag.outputs.tag }}
