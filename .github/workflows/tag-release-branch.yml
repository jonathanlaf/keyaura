name: Tag merged release branch

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

jobs:
  tag:
    name: Tag merged release
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      startsWith(github.event.pull_request.head.ref, 'release/v')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 1

      - name: Validate release branch and version
        id: version
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$BRANCH" =~ ^release/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release branch must match release/vX.Y.Z (got $BRANCH)"
            exit 1
          fi
          TAG="${BRANCH#release/}"
          CONFIG_VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)
          if [[ "$TAG" != "v$CONFIG_VERSION" ]]; then
            echo "::error::$TAG does not match tauri.conf.json version $CONFIG_VERSION"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create and push release tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            git fetch --no-tags origin "refs/tags/$TAG:refs/tags/$TAG"
            if [[ "$(git rev-parse "$TAG^{commit}")" != "$MERGE_SHA" ]]; then
              echo "::error::Tag $TAG already points to a different commit."
              exit 1
            fi
            echo "Tag $TAG already points to this merge; continuing the release."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$MERGE_SHA" -m "release: $TAG"
          git push origin "$TAG"

  release:
    name: Release tagged merge
    needs: tag
    permissions:
      contents: write
      id-token: write
      attestations: write
    # GITHUB_TOKEN tag pushes do not trigger other workflows. Call the same
    # release workflow directly so no additional token or secret is needed.
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
