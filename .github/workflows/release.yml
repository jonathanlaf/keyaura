name: Release

on:
  push:
    tags:
      # Exact semver only (no prerelease suffix) — tauri.conf.json's version
      # field is plain semver, so a v0.1.0-beta1-style tag could never match
      # it in the version-check step below; keeping the pattern this strict
      # means such a tag is simply never picked up by this workflow at all.
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_call:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  guard:
    name: Verify tag is on main
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Validate release tag
        id: version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must match vX.Y.Z."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ steps.version.outputs.tag }}
          fetch-depth: 0
      - name: Tag must be reachable from main
        id: commit
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch origin main
          COMMIT=$(git rev-parse HEAD)
          if ! git merge-base --is-ancestor "$COMMIT" origin/main; then
            echo "::error::Tag $TAG is not on main — deleting it and refusing to release."
            git push origin --delete "$TAG"
            exit 1
          fi
          echo "sha=$COMMIT" >> "$GITHUB_OUTPUT"

  build:
    name: Build and release
    needs: guard
    runs-on: macos-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.guard.outputs.commit }}

      - name: Verify tag matches tauri.conf.json version
        env:
          TAG: ${{ needs.guard.outputs.tag }}
        run: |
          TAG_VERSION="${TAG#v}"
          CONF_VERSION=$(jq -r .version src-tauri/tauri.conf.json)
          if [ "$TAG_VERSION" != "$CONF_VERSION" ]; then
            echo "::error::Tag $TAG does not match tauri.conf.json version $CONF_VERSION"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Verify Cargo.lock is current
        working-directory: src-tauri
        run: cargo build --locked --release

      - name: Test release source and Cargo/Tauri version consistency
        working-directory: src-tauri
        run: cargo test --locked

      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ needs.guard.outputs.tag }}
          releaseName: 'KeyAura ${{ needs.guard.outputs.tag }}'
          generateReleaseNotes: true
          releaseDraft: true
          prerelease: false

      - name: Attest build provenance
        # Depends on tauri.conf.json's bundle.targets including "dmg" — if
        # that's ever reverted to just ["app"], this glob matches nothing.
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'src-tauri/target/release/bundle/dmg/*.dmg'
