name: Release

on:
  push:
    tags:
      # Exact semver only (no prerelease suffix) — tauri.conf.json's version
      # field is plain semver, so a v0.1.0-beta1-style tag could never match
      # it in the version-check step below; keeping the pattern this strict
      # means such a tag is simply never picked up by this workflow at all.
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_call:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  guard:
    name: Verify tag is on main
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Validate release tag
        id: version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must match vX.Y.Z."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ steps.version.outputs.tag }}
          fetch-depth: 0
      - name: Verify tag matches tauri.conf.json version
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          TAG_VERSION="${TAG#v}"
          CONF_VERSION=$(jq -r .version src-tauri/tauri.conf.json)
          if [ "$TAG_VERSION" != "$CONF_VERSION" ]; then
            echo "::error::Tag $TAG does not match tauri.conf.json version $CONF_VERSION"
            exit 1
          fi
      - name: Tag must be reachable from main
        id: commit
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch origin main
          COMMIT=$(git rev-parse HEAD)
          if ! git merge-base --is-ancestor "$COMMIT" origin/main; then
            echo "::error::Tag $TAG is not on main — deleting it and refusing to release."
            git push origin --delete "$TAG"
            exit 1
          fi
          echo "sha=$COMMIT" >> "$GITHUB_OUTPUT"

  notes:
    name: Build release notes
    needs: guard
    runs-on: ubuntu-latest
    outputs:
      body: ${{ steps.release_notes.outputs.body }}
    steps:
      - name: Build release notes from merged feature pull requests
        id: release_notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.guard.outputs.tag }}
        run: |
          set -euo pipefail

          # Feature work is merged into release/vX.Y.Z before that branch is
          # merged into main. GitHub's generated release notes only see the
          # final release PR, so collect the feature PR descriptions directly.
          RELEASE_BRANCH="release/$TAG"
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          PRS_FILE="$RUNNER_TEMP/release-prs.json"

          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/pulls?state=closed&base=$RELEASE_BRANCH&sort=updated&direction=asc&per_page=100" \
            > "$PRS_FILE"

          jq -r '
            [ .[] | .[] | select(.merged_at != null) ]
            | sort_by(.merged_at)
            | if length == 0 then
                "No feature pull requests were merged into this release branch."
              else
                .[]
                | "## [#\(.number) — \(.title)](\(.html_url))\n\n"
                  + (if (.body | length) > 0 then .body else "_No description was provided._" end)
                  + "\n"
              end
          ' "$PRS_FILE" > "$NOTES_FILE"

          DELIMITER="KEYAURA_RELEASE_NOTES_$(uuidgen)"
          {
            echo "body<<$DELIMITER"
            cat "$NOTES_FILE"
            echo "$DELIMITER"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build and release
    needs: [guard, notes]
    strategy:
      # One platform's build failing (e.g. a Windows-only packaging issue)
      # shouldn't cancel a healthy macOS build mid-upload to the same draft
      # release, or vice versa. There's no job here that waits for every
      # platform before deciding whether to publish — each leg independently
      # uploads its artifact to the same draft release as soon as it's done.
      # The release stays a *draft* specifically so a human checks that
      # every expected platform's installer actually showed up before
      # publishing it, rather than that being automated.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundle_glob: src-tauri/target/release/bundle/dmg/*.dmg
          - os: windows-latest
            bundle_glob: src-tauri/target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.guard.outputs.commit }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Verify Cargo.lock is current
        working-directory: src-tauri
        run: cargo build --locked --release

      - name: Test release source and Cargo/Tauri version consistency
        working-directory: src-tauri
        run: cargo test --locked

      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ needs.guard.outputs.tag }}
          releaseName: 'KeyAura ${{ needs.guard.outputs.tag }}'
          releaseBody: ${{ needs.notes.outputs.body }}
          # The body above intentionally contains PR descriptions. GitHub's
          # generator would add only the final release-branch PR and commits.
          generateReleaseNotes: false
          releaseDraft: true
          prerelease: false

      - name: Attest build provenance
        # matrix.bundle_glob (defined alongside each os above) is the single
        # source of truth for where each platform's bundler writes its
        # installer — depends on tauri.conf.json's bundle.targets including
        # "dmg"/"nsis"; if those are ever changed, the glob matches nothing.
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ matrix.bundle_glob }}
